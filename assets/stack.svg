<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250"><style>
:root{--bg:#0a0a0c;--card:#0e0f12;--fg:#e6e8ee;--dim:#7d8596;--faint:#2a3142;--line:#1c2230;--acc:#ff3b47;--acc2:#b48cff;
      --c0:#17191f;--c1:#3d1418;--c2:#7d1b23;--c3:#c9303a;--c4:#ff5a62}
@media (prefers-color-scheme:light){:root{--bg:#ffffff;--card:#ffffff;--fg:#0f1218;--dim:#5b6372;--faint:#d5d9e0;--line:#e3e6ec;--acc:#c8102e;--acc2:#e5383b;
      --c0:#f1f2f4;--c1:#fbd3d6;--c2:#f2979e;--c3:#de4450;--c4:#a50f1c}}
.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.eyebrow{fill:var(--dim);font-size:12px;letter-spacing:2.6px}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
.fade{opacity:0;animation:fade .8s ease forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes sweep{from{transform:translateX(-420px)}to{transform:translateX(1240px)}}
@keyframes drift{to{transform:translate(-80px,30px)}}
@keyframes blink{50%{opacity:0}}
@keyframes run{to{stroke-dashoffset:-2000}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}

    .bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow .8s cubic-bezier(.2,.8,.2,1) forwards}
    .it{fill:var(--fg);font-size:16px;opacity:0;animation:slide .7s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes slide{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
    </style><defs><linearGradient id="bd" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ff3b47"/><stop offset="1" stop-color="#ff8f8f"/></linearGradient></defs><rect x=".5" y=".5" width="1199" height="249" rx="14" fill="var(--card)" stroke="var(--line)"/><rect x=".5" y=".5" width="1199" height="249" rx="14" fill="none" stroke="url(#bd)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="348 2552" opacity=".85"><animate attributeName="stroke-dashoffset" from="0" to="-2900" dur="7.0s" repeatCount="indefinite"/></rect><text class="mono eyebrow fade" x="64" y="62" style="animation-delay:0.00s">LANGUAGES</text><rect class="bar" x="64" y="74" width="28" height="2" fill="var(--acc)" style="animation-delay:0.00s"/><text class="sans it" x="64" y="112" style="animation-delay:0.25s">Python</text><text class="sans it" x="64" y="142" style="animation-delay:0.32s">C#</text><text class="sans it" x="64" y="172" style="animation-delay:0.39s">Java</text><text class="sans it" x="64" y="202" style="animation-delay:0.46s">Lua</text><text class="mono eyebrow fade" x="332" y="62" style="animation-delay:0.08s">INFRASTRUCTURE</text><rect class="bar" x="332" y="74" width="28" height="2" fill="var(--acc)" style="animation-delay:0.08s"/><text class="sans it" x="332" y="112" style="animation-delay:0.33s">Docker</text><text class="sans it" x="332" y="142" style="animation-delay:0.40s">Linux</text><text class="sans it" x="332" y="172" style="animation-delay:0.47s">Git</text><text class="sans it" x="332" y="202" style="animation-delay:0.54s">Batch / PowerShell</text><text class="mono eyebrow fade" x="600" y="62" style="animation-delay:0.16s">REVERSE ENGINEERING</text><rect class="bar" x="600" y="74" width="28" height="2" fill="var(--acc)" style="animation-delay:0.16s"/><text class="sans it" x="600" y="112" style="animation-delay:0.41s">Ghidra</text><text class="sans it" x="600" y="142" style="animation-delay:0.48s">IDA Pro</text><text class="sans it" x="600" y="172" style="animation-delay:0.55s">JVM internals</text><text class="sans it" x="600" y="202" style="animation-delay:0.62s">NTFS</text><text class="mono eyebrow fade" x="868" y="62" style="animation-delay:0.24s">CURRENTLY LEARNING</text><rect class="bar" x="868" y="74" width="28" height="2" fill="var(--acc)" style="animation-delay:0.24s"/><text class="sans it" x="868" y="112" style="animation-delay:0.49s">C++</text><text class="sans it" x="868" y="142" style="animation-delay:0.56s">Godot (.NET)</text></svg>