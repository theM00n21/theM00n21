name: Refresh profile

on:
  schedule:
    - cron: "17 6 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profile.config.json"
      - "scripts/**"
      - ".github/workflows/profile.yml"

# Nothing is granted at the workflow level; the job asks only for what it needs.
permissions: {}

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  render:
    # Never run on forks or for anyone else's copy of this repo.
    if: github.repository == 'theM00n21/theM00n21'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # only to commit the regenerated cards
    steps:
      # Pinned to a full commit SHA (v4.4.0) so a moved tag can't inject code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1

      # Uses the runner's built-in Python 3; no third-party actions involved.
      - name: Render cards from live GitHub data
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git diff --cached --quiet || git commit -m "chore: refresh profile cards"
          git push
